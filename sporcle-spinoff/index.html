<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sporcle Spinoff — Beep boop</title>
    <meta name="description" content="Trivia quizzes: capitals, flags, maps, and more." />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" />
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff8dc; }
      h1, .brand-mono { font-family: 'DM Mono', monospace; }
      .move-up { transition: transform 0.2s ease, box-shadow 0.2s ease; }
      .move-up:hover { transform: translateY(-4px); }
      .dog-watermark {
        position: absolute; right: -10px; top: -14px; width: 130px; height: 130px;
        background: url('/ugly-dog-images/dog-3.png') center/contain no-repeat;
        opacity: 0.14; pointer-events: none;
      }
    </style>
  </head>
  <body class="text-gray-900 min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="px-4 sm:px-8 py-3 sm:py-4 flex items-center justify-between sticky top-0 z-10" style="background:#f267a0;">
      <a href="/" class="brand-mono font-extrabold text-sm sm:text-2xl rounded-md border-2 sm:border-4 border-white text-white select-none px-2 py-1 sm:p-2 no-underline whitespace-nowrap flex items-center gap-1.5">
        <img src="/ugly-dog-images/dog-3.png" alt="" width="20" height="20" style="object-fit:contain;flex-shrink:0;" />
        Beep boop
      </a>
      <div class="flex items-center gap-3 sm:gap-8">
        <a href="/#projects" class="text-xs sm:text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100 whitespace-nowrap">Projects</a>
        <a href="/archive/" class="text-xs sm:text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100 whitespace-nowrap">Archive</a>
      </div>
    </nav>

    <div class="px-4 pt-5 pb-2 sm:px-10 md:px-16 flex items-start justify-between gap-4 relative overflow-hidden">
      <div class="dog-watermark"></div>
      <div class="relative">
        <h1 class="text-xl md:text-2xl font-extrabold text-gray-900">Sporcle Spinoff</h1>
        <p class="mt-0.5 text-xs font-bold text-gray-500">Quick trivia quizzes. Pick one and see how you do.</p>
      </div>
      <a href="./builder.html" class="relative flex-shrink-0 text-[11px] font-extrabold text-gray-500 hover:text-gray-900 no-underline border-2 border-gray-300 hover:border-gray-900 rounded-md px-2.5 py-1.5 whitespace-nowrap">+ Create a quiz</a>
    </div>

    <div id="quiz-sections" class="px-4 pb-10 sm:px-10 md:px-16 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-x-6 gap-y-6"></div>

    <script>
      // Fixed display order; only types with at least one quiz get a section.
      const TYPE_ORDER = ['text-entry', 'multiple-choice', 'image', 'matching', 'ranking', 'map', 'map-highlight'];
      const TYPE_LABELS = {
        'text-entry': 'Type the Answer',
        'multiple-choice': 'Multiple Choice',
        image: 'Picture Round',
        matching: 'Matching',
        ranking: 'Put in Order',
        map: 'Click the Map',
        'map-highlight': 'Name the Highlight',
      };

      function cardHtml(q) {
        return `
          <a href="./play.html?quiz=${encodeURIComponent(q.id)}" class="no-underline">
            <div class="move-up cursor-pointer h-14 flex flex-col items-start justify-center text-left bg-[#fffdf3] shadow-sm hover:shadow-lg px-2 w-full border-2 border-[#2c2e25] rounded overflow-hidden">
              <div class="text-[11px] font-extrabold text-gray-900 leading-tight line-clamp-1">${q.title}</div>
              <div class="mt-0.5 text-[10px] font-semibold text-gray-500 leading-snug line-clamp-2">${q.blurb || ''}</div>
            </div>
          </a>`;
      }

      function typeBlockHtml(type, quizzes) {
        return `
          <div class="h-64 flex flex-col bg-white border-2 border-[#2c2e25] rounded p-2">
            <h2 class="text-xs font-extrabold text-gray-900 mb-1.5 uppercase tracking-wide flex-shrink-0">${TYPE_LABELS[type] || type}</h2>
            <div class="flex-1 min-h-0 overflow-y-auto flex flex-col gap-1 pr-1">${quizzes.map(cardHtml).join('')}</div>
          </div>`;
      }

      fetch('./quizzes/index.json')
        .then((r) => r.json())
        .then((quizzes) => {
          const byType = new Map();
          quizzes.forEach((q) => {
            if (!byType.has(q.type)) byType.set(q.type, []);
            byType.get(q.type).push(q);
          });
          const types = [
            ...TYPE_ORDER.filter((t) => byType.has(t)),
            ...[...byType.keys()].filter((t) => !TYPE_ORDER.includes(t)),
          ];
          // Real grid cells (not nested flex columns) so row 2's headings
          // align across columns regardless of how tall row 1 is.
          const sections = document.getElementById('quiz-sections');
          sections.innerHTML = types.map((type) => typeBlockHtml(type, byType.get(type))).join('');
        })
        .catch(() => {
          document.getElementById('quiz-sections').innerHTML = '<p class="text-gray-500 font-bold">Couldn\'t load the quiz catalog.</p>';
        });
    </script>

  </body>
</html>
