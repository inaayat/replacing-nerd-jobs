<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sporcle Spinoff — Beep boop</title>
    <meta name="description" content="Trivia quizzes: capitals, flags, maps, and more." />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F0EBF4; }
      .move-up { transition: transform 0.2s ease, box-shadow 0.2s ease; }
      .move-up:hover { transform: translateY(-4px); }
    </style>
  </head>
  <body class="text-gray-900 min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="px-8 py-4 flex items-center justify-between sticky top-0 z-10" style="background:#f267a0;">
      <a href="/" class="font-extrabold text-2xl rounded-md border-4 border-white text-white select-none p-2 no-underline">Beep boop</a>
      <div class="flex items-center gap-8">
        <a href="/#projects" class="text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100">Projects</a>
        <a href="/archive/" class="text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100">Archive</a>
      </div>
    </nav>

    <div class="px-10 pt-5 pb-2 md:px-16">
      <h1 class="text-xl md:text-2xl font-extrabold text-gray-900">Sporcle Spinoff</h1>
      <p class="mt-0.5 text-xs font-bold text-gray-500">Quick trivia quizzes. Pick one and see how you do.</p>
    </div>

    <div id="quiz-sections" class="px-10 pb-10 md:px-16 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-x-6 gap-y-6"></div>

    <script>
      // Fixed display order; only types with at least one quiz get a section.
      const TYPE_ORDER = ['text-entry', 'multiple-choice', 'image', 'matching', 'ranking', 'map'];
      const TYPE_LABELS = {
        'text-entry': 'Type the Answer',
        'multiple-choice': 'Multiple Choice',
        image: 'Picture Round',
        matching: 'Matching',
        ranking: 'Put in Order',
        map: 'Click the Map',
      };

      function cardHtml(q) {
        return `
          <a href="./play.html?quiz=${encodeURIComponent(q.id)}" class="no-underline">
            <div class="move-up cursor-pointer h-16 flex flex-col items-center justify-center text-center bg-[#f9fafb] shadow-sm hover:shadow-lg px-2 w-full border-2 border-gray-900 rounded-md overflow-hidden">
              <div class="text-[11px] font-extrabold text-gray-900 leading-tight line-clamp-1">${q.title}</div>
              <div class="mt-0.5 text-[10px] font-semibold text-gray-500 leading-snug line-clamp-2">${q.blurb || ''}</div>
            </div>
          </a>`;
      }

      function typeBlockHtml(type, quizzes) {
        return `
          <div>
            <h2 class="text-xs font-extrabold text-gray-900 mb-1 uppercase tracking-wide">${TYPE_LABELS[type] || type}</h2>
            <div class="flex flex-col gap-1.5">${quizzes.map(cardHtml).join('')}</div>
          </div>`;
      }

      fetch('./quizzes/index.json')
        .then((r) => r.json())
        .then((quizzes) => {
          const byType = new Map();
          quizzes.forEach((q) => {
            if (!byType.has(q.type)) byType.set(q.type, []);
            byType.get(q.type).push(q);
          });
          const types = [
            ...TYPE_ORDER.filter((t) => byType.has(t)),
            ...[...byType.keys()].filter((t) => !TYPE_ORDER.includes(t)),
          ];
          // Real grid cells (not nested flex columns) so row 2's headings
          // align across columns regardless of how tall row 1 is.
          const sections = document.getElementById('quiz-sections');
          sections.innerHTML = types.map((type) => typeBlockHtml(type, byType.get(type))).join('');
        })
        .catch(() => {
          document.getElementById('quiz-sections').innerHTML = '<p class="text-gray-500 font-bold">Couldn\'t load the quiz catalog.</p>';
        });
    </script>

  </body>
</html>
