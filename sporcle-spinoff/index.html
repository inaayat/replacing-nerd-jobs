<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sporcle Spinoff — Beep boop</title>
    <meta name="description" content="Trivia quizzes: capitals, flags, maps, and more." />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F0EBF4; }
      .move-up { transition: transform 0.2s ease, box-shadow 0.2s ease; }
      .move-up:hover { transform: translateY(-4px); }
    </style>
  </head>
  <body class="text-gray-900 min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="px-8 py-4 flex items-center justify-between sticky top-0 z-10" style="background:#f267a0;">
      <a href="/" class="font-extrabold text-2xl rounded-md border-4 border-white text-white select-none p-2 no-underline">Beep boop</a>
      <div class="flex items-center gap-8">
        <a href="/#projects" class="text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100">Projects</a>
        <a href="/archive/" class="text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100">Archive</a>
      </div>
    </nav>

    <div class="px-16 pt-16 pb-8 md:px-24">
      <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900">Sporcle Spinoff</h1>
      <p class="mt-4 text-xl font-bold text-gray-500">Quick trivia quizzes. Pick one and see how you do.</p>
    </div>

    <div id="quiz-grid" class="px-16 pb-16 md:px-24 flex-grow">
      <div class="grid grid-cols-12" id="quiz-grid-inner"></div>
    </div>

    <script>
      const TYPE_LABELS = {
        'text-entry': 'Type the answer',
        'multiple-choice': 'Multiple choice',
        image: 'Picture round',
        matching: 'Matching',
        ranking: 'Put in order',
        map: 'Click the map',
      };

      fetch('./quizzes/index.json')
        .then((r) => r.json())
        .then((quizzes) => {
          const grid = document.getElementById('quiz-grid-inner');
          grid.innerHTML = quizzes.map((q) => `
            <div class="col-span-12 md:col-span-6 lg:col-span-4 p-2">
              <a href="./play.html?quiz=${encodeURIComponent(q.id)}" class="no-underline">
                <div class="move-up cursor-pointer text-center bg-[#f9fafb] shadow-md hover:shadow-xl p-4 w-full border-4 border-gray-900 rounded-lg">
                  <div class="mt-1 text-sm font-extrabold text-gray-900 leading-tight">${q.title}</div>
                  <div class="mt-1 text-xs font-bold text-gray-500">${q.blurb || ''}</div>
                  <div class="mt-2 inline-block text-[10px] font-extrabold uppercase tracking-wide text-white rounded px-2 py-1" style="background:#f267a0;">${TYPE_LABELS[q.type] || q.type}</div>
                </div>
              </a>
            </div>`).join('');
        })
        .catch(() => {
          document.getElementById('quiz-grid-inner').innerHTML = '<p class="col-span-12 text-gray-500 font-bold">Couldn\'t load the quiz catalog.</p>';
        });
    </script>

  </body>
</html>
