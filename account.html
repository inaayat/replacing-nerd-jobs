<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account — Beep boop</title>
    <meta name="description" content="Sign in to inaayat.xyz." />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" />
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff8dc; }
      h1, .card-title, .brand-mono { font-family: 'DM Mono', monospace; }
      /* auth states toggle via this class; don't depend on the Tailwind CDN for it */
      .hidden { display: none; }
      .auth-input {
        width: 100%; font-size: 0.85rem; padding: 8px 10px; margin-bottom: 10px;
        border: 2px solid #2c2e25; border-radius: 4px; background: #fff;
      }
      .auth-tab {
        font-weight: 800; font-size: 0.8rem; padding: 6px 14px; border: 2px solid #2c2e25;
        background: #fff; cursor: pointer; border-radius: 4px;
      }
      .auth-tab.active { background: #f267a0; color: #fff; }
    </style>
  </head>
  <body class="text-gray-900 min-h-screen flex flex-col">

    <!-- Nav -->
    <nav class="px-4 sm:px-8 py-3 sm:py-4 flex items-center justify-between sticky top-0 z-10" style="background:#f267a0;">
      <a href="/" class="brand-mono font-extrabold text-sm sm:text-2xl rounded-md border-2 sm:border-4 border-white text-white select-none px-2 py-1 sm:p-2 no-underline flex items-center gap-1 sm:gap-2 whitespace-nowrap">
        <img src="/ugly-dog-images/dog-3.png" alt="" width="30" height="30" style="object-fit:contain;flex-shrink:0;" />
        Beep boop
      </a>
      <div class="flex items-center gap-3 sm:gap-8">
        <a href="/#projects" class="text-xs sm:text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100 whitespace-nowrap">Projects</a>
        <a href="/archive/" class="text-xs sm:text-xl font-extrabold text-white no-underline opacity-80 hover:opacity-100 whitespace-nowrap">Archive</a>
        <span id="user-email" class="hidden text-xs sm:text-base font-extrabold text-white whitespace-nowrap"></span>
      </div>
    </nav>

    <!-- Content -->
    <div class="px-6 pt-12 pb-16 md:px-24 flex-grow flex flex-col items-center">
      <h1 class="text-3xl md:text-4xl font-extrabold mb-8">Account</h1>

      <!-- Neon Auth not configured yet -->
      <div id="not-configured" class="hidden max-w-lg w-full bg-[#f9fafb] border-4 border-[#2c2e25] rounded shadow-md p-6 text-sm">
        <p class="font-extrabold mb-2">Sign-in isn't set up yet.</p>
        <p class="text-gray-600">Add the Neon Auth base URL to <code class="brand-mono">auth-config.js</code> — see the "auth &amp; database" section of the README.</p>
      </div>

      <!-- Sign in / sign up forms -->
      <div id="auth-forms" class="hidden max-w-sm w-full bg-[#f9fafb] border-4 border-[#2c2e25] rounded shadow-md p-6">
        <div class="flex gap-2 mb-4">
          <button type="button" class="auth-tab active" id="tab-signin">Sign in</button>
          <button type="button" class="auth-tab" id="tab-signup">Sign up</button>
        </div>
        <form id="form-signin">
          <input class="auth-input" type="email" id="signin-email" placeholder="email" autocomplete="email" required />
          <input class="auth-input" type="password" id="signin-password" placeholder="password" autocomplete="current-password" required />
          <button type="submit" class="w-full font-extrabold text-sm py-2 rounded text-white" style="background:#f267a0;">Sign in</button>
        </form>
        <form id="form-signup" class="hidden">
          <input class="auth-input" type="text" id="signup-name" placeholder="name" autocomplete="name" required />
          <input class="auth-input" type="email" id="signup-email" placeholder="email" autocomplete="email" required />
          <input class="auth-input" type="password" id="signup-password" placeholder="password (8+ characters)" autocomplete="new-password" required minlength="8" />
          <button type="submit" class="w-full font-extrabold text-sm py-2 rounded text-white" style="background:#f267a0;">Sign up</button>
        </form>
        <p id="auth-error" class="hidden text-xs font-bold mt-3" style="color:#b05858;"></p>
      </div>

      <!-- Profile card when signed in -->
      <div id="profile" class="hidden max-w-lg w-full bg-[#f9fafb] border-4 border-[#2c2e25] rounded shadow-md p-6">
        <div class="card-title text-lg font-extrabold mb-4">You're signed in 🎉</div>
        <dl id="profile-fields" class="text-sm grid grid-cols-[auto_1fr] gap-x-4 gap-y-2"></dl>
        <p id="profile-note" class="mt-4 text-xs text-gray-500"></p>
        <button type="button" id="sign-out-btn" class="mt-4 font-extrabold text-xs py-2 px-4 rounded border-2 border-[#2c2e25]">Sign out</button>
      </div>
    </div>

    <footer class="px-16 py-4 md:px-24 text-sm font-bold text-white flex items-center gap-3" style="background:#1b1464;">
      <a href="https://github.com/inaayat" target="_blank" class="text-white opacity-80 hover:opacity-100 flex items-center gap-2 no-underline">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
        </svg>
        github.com/inaayat
      </a>
    </footer>

    <script type="module">
      const show = (id) => document.getElementById(id).classList.remove('hidden');
      const hide = (id) => document.getElementById(id).classList.add('hidden');
      const nextUrl = () => {
        const next = new URLSearchParams(location.search).get('next');
        if (!next || !next.startsWith('/')) return null;
        return next;
      };
      const goAfterAuth = () => {
        const next = nextUrl();
        if (next) location.href = next;
        else location.reload();
      };

      init();

      async function init() {
        let url = null;
        try {
          const res = await fetch('/api/auth-config');
          url = (await res.json()).url;
        } catch {
          // treated as "not configured" below
        }
        if (!url) show('not-configured');
        else run(url);
      }

      async function run(authUrl) {
        const { loadNeonAuth, resolveNeonJwt } = await import('/engine/neon-browser-auth.js');
        const neonAuth = await loadNeonAuth(authUrl);
        const client = neonAuth.adapter;

        wireAuthForms(client);
        document.getElementById('sign-out-btn').addEventListener('click', async () => {
          await client.signOut();
          location.reload();
        });

        const { data } = await client.getSession();
        if (data?.user) {
          if (nextUrl()) {
            goAfterAuth();
            return;
          }
          renderSignedIn(data.user, neonAuth);
        } else {
          show('auth-forms');
        }
      }

      function wireAuthForms(client) {
        const tabIn = document.getElementById('tab-signin');
        const tabUp = document.getElementById('tab-signup');
        const formIn = document.getElementById('form-signin');
        const formUp = document.getElementById('form-signup');
        tabIn.addEventListener('click', () => {
          tabIn.classList.add('active'); tabUp.classList.remove('active');
          formIn.classList.remove('hidden'); formUp.classList.add('hidden');
        });
        tabUp.addEventListener('click', () => {
          tabUp.classList.add('active'); tabIn.classList.remove('active');
          formUp.classList.remove('hidden'); formIn.classList.add('hidden');
        });

        const errEl = document.getElementById('auth-error');
        const showError = (message) => { errEl.textContent = message; errEl.classList.remove('hidden'); };

        formIn.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.add('hidden');
          const { error } = await client.signIn.email({
            email: document.getElementById('signin-email').value,
            password: document.getElementById('signin-password').value,
          });
          if (error) showError(error.message || 'Sign-in failed.');
          else goAfterAuth();
        });

        formUp.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.add('hidden');
          const { error } = await client.signUp.email({
            name: document.getElementById('signup-name').value,
            email: document.getElementById('signup-email').value,
            password: document.getElementById('signup-password').value,
          });
          if (error) showError(error.message || 'Sign-up failed.');
          else goAfterAuth();
        });
      }

      async function renderSignedIn(user, neonAuth) {
        show('profile');
        const emailBadge = document.getElementById('user-email');
        emailBadge.textContent = user.email || user.name || '';
        emailBadge.classList.remove('hidden');

        const fields = document.getElementById('profile-fields');
        const note = document.getElementById('profile-note');
        try {
          const token = await resolveNeonJwt(neonAuth, client);
          if (!token) throw new Error('Could not get session token. Try signing out and back in.');
          const res = await fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
          const u = data.user;
          const rows = [
            ['name', u.name || '—'],
            ['email', u.email || '—'],
            ['user id', u.id],
            ['first seen', new Date(u.created_at).toLocaleString()],
          ];
          fields.innerHTML = rows
            .map(([k, v]) => `<dt class="font-extrabold text-gray-500">${k}</dt><dd class="break-all">${v}</dd>`)
            .join('');
          note.textContent = 'This profile is stored in the Neon database and refreshed each visit.';
        } catch (err) {
          fields.innerHTML = `<dt class="font-extrabold text-gray-500">name</dt><dd>${user.name || '—'}</dd>`;
          note.textContent = `Profile database unavailable: ${err.message}`;
        }
      }
    </script>
  </body>
</html>
