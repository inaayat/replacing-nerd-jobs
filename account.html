<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Beep boop</title>
    <meta name="description" content="Sign in to inaayat.xyz." />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
    <style>
      :root {
        --cream: #faf3e3;
        --orange: #f2a154;
        --peach: #f6a98a;
        --teal: #123a39;
        --red: #cf4520;
        --gold: #e3a72e;
        --gray: #d8d3c6;
        --ink: #1c1c1c;
        /* irregular blob palette (fun accents) */
        --blob-peach: #f4a882;
        --blob-teal: #2a9d8f;
        --blob-purple: #5c4b8a;
        --blob-slate: #6b7bb5;
        --blob-lime: #a8c93a;
        --blob-orange: #f2a154;
        --blob-navy: #1e3a5f;
        --blob-rose: #c47a8a;
        --blob-sage: #8fa88a;
      }
      body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--cream); }
      .serif { font-family: 'Fraunces', serif; }
      .brand-mono { font-family: 'DM Mono', monospace; }
      .hidden { display: none; }

      html, body { height: 100%; }
      body { margin: 0; }
      .page-main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
      @media (min-width: 768px) {
        body { height: 100vh; overflow: hidden; }
        .page-main { flex-direction: row; }
      }

      .sidebar {
        flex-shrink: 0;
        border-radius: 18px;
        padding: 20px;
        background: var(--cream);
        border: 1.5px solid #1c1c1c22;
      }
      @media (min-width: 768px) {
        .sidebar {
          width: 340px;
          height: 100%;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
      }
      @media (min-width: 1024px) { .sidebar { width: 420px; } }

      .sidebar-link {
        font-size: 0.72rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #1c1c1c;
        opacity: 0.55;
        text-decoration: none;
      }
      .sidebar-link:hover { opacity: 1; }

      .content-scroll {
        flex: 1 1 auto;
        min-height: 0;
        padding: 8px 16px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      @media (min-width: 768px) {
        .content-scroll { overflow-y: auto; height: 100%; }
      }

      /* Decorative floating blobs */
      .decor-blob {
        position: absolute;
        pointer-events: none;
        z-index: 0;
        opacity: 0.55;
      }
      .decor-blob-a {
        width: 120px; height: 110px;
        background: var(--blob-lime);
        border-radius: 60% 40% 55% 45% / 55% 45% 60% 40%;
        top: 8%; left: 6%;
        animation: drift 9s ease-in-out infinite alternate;
      }
      .decor-blob-b {
        width: 90px; height: 100px;
        background: var(--blob-slate);
        border-radius: 45% 55% 40% 60% / 50% 35% 65% 50%;
        top: 12%; right: 10%;
        animation: drift 11s ease-in-out infinite alternate-reverse;
      }
      .decor-blob-c {
        width: 70px; height: 80px;
        background: var(--blob-rose);
        border-radius: 70% 30% 55% 45% / 40% 60% 35% 65%;
        bottom: 14%; left: 12%;
        animation: drift 10s ease-in-out infinite alternate;
      }
      .decor-blob-d {
        width: 100px; height: 85px;
        background: var(--blob-sage);
        border-radius: 40% 60% 50% 50% / 60% 30% 70% 40%;
        bottom: 10%; right: 8%;
        animation: drift 12s ease-in-out infinite alternate-reverse;
      }
      @keyframes drift {
        from { transform: translate(0, 0) rotate(0deg); }
        to { transform: translate(8px, -10px) rotate(4deg); }
      }

      .login-hero {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(280px, 70vw);
        height: min(180px, 42vw);
        margin-bottom: 28px;
      }
      .login-blob {
        position: absolute;
        inset: 0;
        background: var(--blob-peach);
        border-radius: 58% 42% 48% 52% / 52% 38% 62% 48%;
        animation: blobMorph 8s ease-in-out infinite;
      }
      .login-blob::before {
        content: "";
        position: absolute;
        inset: 12% 18% auto auto;
        width: 38%;
        height: 42%;
        background: var(--blob-orange);
        border-radius: 45% 55% 60% 40% / 55% 45% 55% 45%;
        opacity: 0.85;
      }
      .login-blob::after {
        content: "";
        position: absolute;
        inset: auto auto 8% 10%;
        width: 28%;
        height: 32%;
        background: var(--blob-teal);
        border-radius: 60% 40% 35% 65% / 45% 55% 40% 60%;
        opacity: 0.7;
      }
      @keyframes blobMorph {
        0%, 100% { border-radius: 58% 42% 48% 52% / 52% 38% 62% 48%; }
        33% { border-radius: 42% 58% 55% 45% / 45% 55% 40% 60%; }
        66% { border-radius: 50% 50% 40% 60% / 60% 40% 55% 45%; }
      }
      .login-title {
        position: relative;
        z-index: 1;
        font-size: clamp(2rem, 5vw, 2.75rem);
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1;
      }

      .auth-panel {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 360px;
        background: #fffdf8;
        border-radius: 18px;
        padding: 24px;
        border: 1.5px solid #1c1c1c14;
      }

      .auth-tab {
        font-family: 'DM Mono', monospace;
        font-weight: 500;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 8px 14px;
        border: none;
        background: transparent;
        color: var(--ink);
        opacity: 0.45;
        cursor: pointer;
        border-radius: 999px;
      }
      .auth-tab.active {
        background: var(--teal);
        color: #f7f2e7;
        opacity: 1;
      }

      .auth-input {
        width: 100%;
        font-family: inherit;
        font-size: 0.9rem;
        padding: 10px 12px;
        margin-bottom: 10px;
        border: 1.5px solid #1c1c1c22;
        border-radius: 12px;
        background: var(--cream);
        color: var(--ink);
        outline: none;
      }
      .auth-input:focus {
        border-color: var(--teal);
        background: #fff;
      }

      .auth-submit {
        width: 100%;
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 1rem;
        padding: 11px 14px;
        border: none;
        border-radius: 12px;
        background: var(--orange);
        color: var(--ink);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .auth-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.1);
      }

      .sign-out-btn {
        font-family: 'DM Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1.5px solid #1c1c1c33;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
      .sign-out-btn:hover { background: var(--gray); }
    </style>
  </head>
  <body class="text-gray-900 flex flex-col">

    <div class="page-main px-4 sm:px-8 md:px-10 py-4 gap-4">

      <aside class="sidebar">
        <div>
          <a href="/" class="serif font-semibold text-2xl md:text-3xl text-gray-900 no-underline flex items-center gap-2">
            <img src="/ugly-dog-images/dog-3.png" alt="" width="28" height="28" style="object-fit:contain;flex-shrink:0;" />
            Beep boop
          </a>
          <div class="flex flex-col gap-2 mt-6 brand-mono">
            <a href="/#projects" class="sidebar-link">Projects</a>
            <a href="/archive/" class="sidebar-link">Archive</a>
            <a href="/account.html" class="sidebar-link" style="opacity:1;">Account</a>
          </div>
        </div>
        <div class="brand-mono text-xs max-w-[26ch] opacity-60 mt-6 md:mt-0">
          Sign in to save progress across tools and experiments.
        </div>
      </aside>

      <div class="content-scroll">
        <div class="decor-blob decor-blob-a" aria-hidden="true"></div>
        <div class="decor-blob decor-blob-b" aria-hidden="true"></div>
        <div class="decor-blob decor-blob-c" aria-hidden="true"></div>
        <div class="decor-blob decor-blob-d" aria-hidden="true"></div>

        <div id="login-hero" class="login-hero">
          <div class="login-blob" aria-hidden="true"></div>
          <h1 id="login-heading" class="login-title serif">Log in</h1>
        </div>

        <!-- Neon Auth not configured yet -->
        <div id="not-configured" class="hidden auth-panel text-sm">
          <p class="serif font-semibold text-lg mb-2">Sign-in isn't set up yet.</p>
          <p class="brand-mono text-xs opacity-60">Add the Neon Auth base URL to <code>auth-config.js</code> — see the "auth &amp; database" section of the README.</p>
        </div>

        <!-- Sign in / sign up forms -->
        <div id="auth-forms" class="hidden auth-panel">
          <div class="flex gap-2 mb-5">
            <button type="button" class="auth-tab active" id="tab-signin">Sign in</button>
            <button type="button" class="auth-tab" id="tab-signup">Sign up</button>
          </div>
          <form id="form-signin">
            <input class="auth-input" type="email" id="signin-email" placeholder="email" autocomplete="email" required />
            <input class="auth-input" type="password" id="signin-password" placeholder="password" autocomplete="current-password" required />
            <button type="submit" class="auth-submit">Sign in</button>
          </form>
          <form id="form-signup" class="hidden">
            <input class="auth-input" type="text" id="signup-name" placeholder="name" autocomplete="name" required />
            <input class="auth-input" type="email" id="signup-email" placeholder="email" autocomplete="email" required />
            <input class="auth-input" type="password" id="signup-password" placeholder="password (8+ characters)" autocomplete="new-password" required minlength="8" />
            <button type="submit" class="auth-submit">Sign up</button>
          </form>
          <p id="auth-error" class="hidden brand-mono text-xs font-medium mt-3" style="color:#cf4520;"></p>
        </div>

        <!-- Profile card when signed in -->
        <div id="profile" class="hidden auth-panel">
          <div class="serif font-semibold text-xl mb-4">You're signed in</div>
          <dl id="profile-fields" class="brand-mono text-xs grid grid-cols-[auto_1fr] gap-x-4 gap-y-2"></dl>
          <p id="profile-note" class="mt-4 brand-mono text-xs opacity-50"></p>
          <button type="button" id="sign-out-btn" class="sign-out-btn mt-5">Sign out</button>
        </div>
      </div>

    </div>

    <script type="module">
      const show = (id) => document.getElementById(id).classList.remove('hidden');
      const hide = (id) => document.getElementById(id).classList.add('hidden');
      const nextUrl = () => {
        const next = new URLSearchParams(location.search).get('next');
        if (!next || !next.startsWith('/')) return null;
        return next;
      };
      const goAfterAuth = () => {
        const next = nextUrl();
        if (next) location.href = next;
        else location.reload();
      };

      init();

      async function init() {
        let url = null;
        try {
          const res = await fetch('/api/auth-config');
          url = (await res.json()).url;
        } catch {
          // treated as "not configured" below
        }
        if (!url) {
          show('not-configured');
          setHero('Log in');
        } else run(url);
      }

      async function run(authUrl) {
        const { loadNeonAuth, resolveNeonJwt } = await import('/engine/neon-browser-auth.js');
        const neonAuth = await loadNeonAuth(authUrl);
        const client = neonAuth.adapter;

        wireAuthForms(client);
        document.getElementById('sign-out-btn').addEventListener('click', async () => {
          await client.signOut();
          location.reload();
        });

        const { data } = await client.getSession();
        if (data?.user) {
          if (nextUrl()) {
            goAfterAuth();
            return;
          }
          setHero('Account');
          renderSignedIn(data.user, neonAuth, client);
        } else {
          setHero('Log in');
          show('auth-forms');
        }
      }

      function setHero(label) {
        const hero = document.getElementById('login-hero');
        const heading = document.getElementById('login-heading');
        if (!label) {
          hero.classList.add('hidden');
          return;
        }
        heading.textContent = label;
        hero.classList.remove('hidden');
      }

      function wireAuthForms(client) {
        const tabIn = document.getElementById('tab-signin');
        const tabUp = document.getElementById('tab-signup');
        const formIn = document.getElementById('form-signin');
        const formUp = document.getElementById('form-signup');
        tabIn.addEventListener('click', () => {
          tabIn.classList.add('active'); tabUp.classList.remove('active');
          formIn.classList.remove('hidden'); formUp.classList.add('hidden');
        });
        tabUp.addEventListener('click', () => {
          tabUp.classList.add('active'); tabIn.classList.remove('active');
          formUp.classList.remove('hidden'); formIn.classList.add('hidden');
        });

        const errEl = document.getElementById('auth-error');
        const showError = (message) => { errEl.textContent = message; errEl.classList.remove('hidden'); };

        formIn.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.add('hidden');
          const { error } = await client.signIn.email({
            email: document.getElementById('signin-email').value,
            password: document.getElementById('signin-password').value,
          });
          if (error) showError(error.message || 'Sign-in failed.');
          else goAfterAuth();
        });

        formUp.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.add('hidden');
          const { error } = await client.signUp.email({
            name: document.getElementById('signup-name').value,
            email: document.getElementById('signup-email').value,
            password: document.getElementById('signup-password').value,
          });
          if (error) showError(error.message || 'Sign-up failed.');
          else goAfterAuth();
        });
      }

      async function renderSignedIn(user, neonAuth, client) {
        show('profile');
        const fields = document.getElementById('profile-fields');
        const note = document.getElementById('profile-note');
        try {
          const token = await resolveNeonJwt(neonAuth, client);
          if (!token) throw new Error('Could not get session token. Try signing out and back in.');
          const res = await fetch('/api/me', { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
          const u = data.user;
          const rows = [
            ['name', u.name || '—'],
            ['email', u.email || '—'],
            ['user id', u.id],
            ['first seen', new Date(u.created_at).toLocaleString()],
          ];
          fields.innerHTML = rows
            .map(([k, v]) => `<dt class="opacity-45">${k}</dt><dd class="break-all">${v}</dd>`)
            .join('');
          note.textContent = 'This profile is stored in the Neon database and refreshed each visit.';
        } catch (err) {
          fields.innerHTML = `<dt class="opacity-45">name</dt><dd>${user.name || '—'}</dd>`;
          note.textContent = `Profile database unavailable: ${err.message}`;
        }
      }
    </script>
  </body>
</html>
