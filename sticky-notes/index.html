<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/sticky-notes/" />
    <title>Sticky Notes — Beep boop</title>
    <meta
      name="description"
      content="A board you dump onto and think on. Cluster notes into collections, file them into memory, wipe the board — nothing is ever lost."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#faf3e3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sticky Notes" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <nav class="sn-nav">
      <div class="sn-nav-brand">
        <a href="/" class="sn-nav-logo" aria-label="Beep boop home">
          <img src="/ugly-dog-images/dog-3.png" alt="" width="18" height="18" style="object-fit: contain" />
          <span>Beep boop</span>
        </a>
        <a href="/sticky-notes/" class="sn-nav-section">
          <img src="/sticky-notes/icon.svg" alt="" width="22" height="22" />
          <span>Sticky Notes</span>
        </a>
      </div>
      <div class="sn-nav-links">
        <button
          type="button"
          class="sn-navchip"
          id="guest-chip"
          hidden
          title="This board is only on this device — sign in to save it"
        >Local only</button>
        <a href="#" data-nav-auth class="sn-nav-keep">Sign in</a>
        <a href="/#projects">Projects</a>
      </div>
    </nav>

    <main class="sn-shell">
      <!-- Signed out the board still works; it just cannot be saved. The strip
           says so, and stays reachable from the toolbar chip once dismissed. -->
      <div class="sn-guestbar" id="guestbar" hidden>
        <span class="sn-guestbar-text" id="guestbar-text"></span>
        <a class="sn-guestbar-cta" id="guestbar-cta" href="/account.html?next=/sticky-notes/">Create an account</a>
        <button type="button" class="sn-guestbar-close" id="guestbar-close" aria-label="Hide this notice">×</button>
      </div>

      <div class="sn-app" id="app" hidden>
        <div class="sn-toolbar">
          <div class="sn-tabs" role="tablist" id="tabs">
            <button type="button" class="sn-tab" id="tab-board" role="tab" aria-selected="true">Board</button>
            <button type="button" class="sn-tab" id="tab-memory" role="tab" aria-selected="false">
              Memory <span class="sn-tab-count" id="memory-count"></span>
            </button>
          </div>
          <div class="sn-toolbar-actions">
            <div class="sn-board-actions" id="board-actions">
            <button
              type="button"
              class="sn-btn sn-btn-primary sn-btn-add"
              id="add-note"
              aria-label="Add a note"
              title="Add a note (N)"
            ><span aria-hidden="true">+</span></button>
            <div class="sn-view-toggle" role="group" aria-label="Board view">
              <button type="button" id="view-canvas" aria-pressed="true" title="Canvas" aria-label="Canvas view"></button>
              <button type="button" id="view-table" aria-pressed="false" title="Table" aria-label="Table view"></button>
            </div>
            <button
              type="button"
              class="sn-btn sn-btn-pen"
              id="add-text"
              aria-pressed="false"
              title="Write on the board — text that is wiped, never filed"
            >
              <span class="sn-pen-glyph" aria-hidden="true"></span>
              <span class="sn-btn-label">Write</span>
            </button>
            <div class="sn-zoom" id="zoom-controls">
              <button type="button" class="sn-zoom-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
              <button type="button" class="sn-zoom-label" id="zoom-fit" title="Fit every note on screen">100%</button>
              <button type="button" class="sn-zoom-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
            </div>
            <button
              type="button"
              class="sn-btn sn-wide-only"
              id="select-all"
              title="Select every note on the board (⌘/Ctrl+A)"
            >
              Select all
            </button>
            <button type="button" class="sn-btn sn-wide-only" id="wipe-board" title="File everything except pinned notes">
              Wipe board
            </button>
            <div class="sn-more">
              <button
                type="button"
                class="sn-iconbtn"
                id="more-btn"
                aria-expanded="false"
                aria-label="More board actions"
                title="More"
              >⋯</button>
              <div class="sn-menu" id="more-menu" hidden>
                <button type="button" class="sn-menu-item" id="menu-select-all">Select all notes</button>
                <button type="button" class="sn-menu-item" id="menu-fit">Fit every note on screen</button>
                <button type="button" class="sn-menu-item" id="menu-wipe">Wipe board</button>
              </div>
            </div>
            </div>
            <button
              type="button"
              class="sn-iconbtn"
              id="board-help"
              aria-expanded="false"
              aria-label="What the buttons do"
              title="What the buttons do"
            >?</button>
          </div>
        </div>

        <div class="sn-workspace" id="workspace">
          <div class="sn-viewport" id="viewport" tabindex="0" aria-label="Sticky note board">
            <div class="sn-world" id="world">
              <svg class="sn-arrows" id="arrow-layer"></svg>
            </div>
            <div class="sn-rubber" id="rubber" hidden></div>
            <div class="sn-empty" id="board-empty" hidden>
              <p class="sn-empty-line">Nothing on the board yet.</p>
              <p class="sn-empty-sub" id="board-empty-sub"></p>
              <p class="sn-empty-sub" id="board-empty-guest" hidden></p>
            </div>
            <div class="sn-hintstrip" id="hint-strip" hidden>
              <span id="hint-text"></span>
              <button type="button" class="sn-hint-dismiss" id="hint-dismiss">Got it</button>
            </div>

            <div class="sn-selbar" id="actionbar" hidden>
              <span class="sn-ab-count" id="ab-count"></span>
              <span class="sn-ab-swatches" id="ab-swatches"></span>
              <span class="sn-ab-iconwrap">
                <button type="button" class="sn-ab-iconbtn" id="ab-icon" title="Tag with an icon" aria-label="Tag with an icon">◇</button>
                <span class="sn-ab-iconpop" id="ab-iconpop" hidden></span>
              </span>
              <button type="button" class="sn-ab-pin" id="ab-pin" title="Pinned notes survive a wipe">Pin</button>
              <span class="sn-ab-collection">
                <label class="sn-ab-label" for="ab-name">Collection</label>
                <input
                  class="sn-ab-name"
                  id="ab-name"
                  list="collection-names"
                  placeholder="Name these notes to group them…"
                  title="Naming a selection makes a collection you can file as one unit"
                />
              </span>
              <datalist id="collection-names"></datalist>
              <button type="button" class="sn-ab-file" id="ab-file" title="Send to memory — nothing is lost">File</button>
              <button
                type="button"
                class="sn-ab-delete"
                id="ab-delete"
                title="Delete for good — ten seconds to undo"
              >Delete</button>
              <span class="sn-ab-hint" id="ab-hint" hidden></span>
            </div>
          </div>

          <div class="sn-table-pane" id="table-pane" hidden>
            <div class="sn-table-root" id="table-root"></div>
          </div>

          <aside class="sn-sidebar" id="sidebar" aria-label="Memory">
            <div class="sn-side-head">
              <span class="sn-side-title">Memory</span>
              <span class="sn-side-count" id="sidebar-count"></span>
              <button
                type="button"
                class="sn-side-toggle"
                id="sidebar-toggle"
                aria-expanded="true"
                aria-label="Collapse memory"
                title="Collapse memory"
              >›</button>
            </div>

            <section class="sn-memory" id="memory-pane">
              <div class="sn-mem-filters" id="mem-filters">
                <input type="search" class="sn-mem-search" id="mem-search" placeholder="Search memory…" />
                <div class="sn-mem-chiprow" id="mem-color-chips" aria-label="Filter by color"></div>
                <div class="sn-mem-chiprow" id="mem-icon-chips" aria-label="Filter by icon"></div>
                <select class="sn-mem-select" id="mem-collection" aria-label="Filter by collection">
                  <option value="">All collections</option>
                </select>
              </div>
              <p class="sn-mem-note">
                A <b>collection</b> is a named group of notes. Select notes on the board, name them
                in the bar at the bottom, then File — the whole group lands here together.
              </p>
              <div class="sn-mem-list" id="mem-list"></div>
              <div class="sn-mem-more">
                <button type="button" class="sn-btn" id="mem-more" hidden>Show more</button>
              </div>
            </section>
          </aside>
        </div>
      </div>
    </main>

    <!-- Tier 1 chrome: rides the note being edited, in screen space. Formatting
         is its own group so it can drop to a second row on a phone. -->
    <div class="sn-editbar" id="editbar" hidden role="toolbar" aria-label="Note actions">
      <button type="button" class="sn-eb-btn sn-eb-danger" id="eb-trash" aria-label="Delete note" title="Delete for good"></button>
      <button type="button" class="sn-eb-btn" id="eb-pin" aria-label="Pin note" title="Pin — survives a wipe"></button>
      <span class="sn-eb-wrap">
        <button type="button" class="sn-eb-btn" id="eb-color" aria-label="Note colour" title="Colour"><span class="sn-eb-dot"></span></button>
        <div class="sn-eb-palette" id="eb-palette" hidden></div>
      </span>
      <span class="sn-eb-wrap">
        <button type="button" class="sn-eb-btn" id="eb-icon" aria-label="Note icon" title="Icon"></button>
        <div class="sn-eb-iconpop" id="eb-iconpop" hidden></div>
      </span>
      <button type="button" class="sn-eb-btn sn-eb-done" id="eb-done" aria-label="Done editing" title="Done">✓</button>
      <span class="sn-eb-group sn-eb-format">
        <button type="button" class="sn-eb-btn" id="eb-bold" aria-label="Bold" title="Bold (⌘/Ctrl+B)"></button>
        <button type="button" class="sn-eb-btn" id="eb-bullets" aria-label="Bullet list" title="Bullet list — or type “* ” on a new line"></button>
        <button type="button" class="sn-eb-btn" id="eb-numbers" aria-label="Numbered list" title="Numbered list — or type “1. ” on a new line"></button>
        <span class="sn-eb-wrap">
          <button type="button" class="sn-eb-btn" id="eb-link" aria-label="Link" title="Link (⌘/Ctrl+K)"></button>
          <div class="sn-eb-linkpop sn-linkpop" id="eb-linkpop" hidden>
            <label class="sn-link-field">
              <span>URL</span>
              <input class="sn-link-url" id="eb-link-url" type="url" inputmode="url" autocomplete="off" placeholder="https://" />
            </label>
            <label class="sn-link-field">
              <span>Text</span>
              <input class="sn-link-text" id="eb-link-text" type="text" autocomplete="off" placeholder="Display text" />
            </label>
            <div class="sn-link-actions">
              <button type="button" class="sn-btn sn-btn-primary sn-link-save" id="eb-link-save">Save</button>
              <button type="button" class="sn-btn sn-link-remove" id="eb-link-remove">Remove</button>
            </div>
          </div>
        </span>
      </span>
    </div>

    <div class="sn-scrim" id="scrim" hidden></div>

    <aside class="sn-guide" id="guide" hidden aria-label="What the buttons do">
      <div class="sn-guide-head">
        <h2 class="sn-guide-title">What everything does</h2>
        <button type="button" class="sn-guide-close" id="guide-close" aria-label="Close">×</button>
      </div>
      <div class="sn-guide-body" id="guide-body"></div>
      <div class="sn-guide-foot">
        <button type="button" class="sn-btn" id="guide-hints">Show the board hint again</button>
      </div>
    </aside>

    <div class="sn-sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Move to collection">
      <div class="sn-sheet-head">
        <span class="sn-sheet-title" id="sheet-title"></span>
        <button type="button" class="sn-guide-close" id="sheet-close" aria-label="Close">×</button>
      </div>
      <div class="sn-sheet-body" id="sheet-body"></div>
    </div>

    <div class="sn-toast" id="toast" role="status" aria-live="polite">
      <span id="toast-text"></span>
      <button type="button" id="toast-undo" hidden>Undo</button>
    </div>

    <script type="module" src="./app.js"></script>
    <script type="module" src="./extension-bridge.js"></script>
  </body>
</html>
