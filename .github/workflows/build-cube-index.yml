name: Build cube index

# Rebuilds packing-cubes/cubes/index.json from the individual cube files
# whenever a cube is added/changed on main. Because the manifest is generated
# — never hand-edited in a PR — two cube submissions can never collide on it.
on:
  push:
    branches: [main]
    paths:
      - 'packing-cubes/cubes/**'
      - 'scripts/build-cube-index.mjs'

concurrency:
  group: build-cube-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate and commit index.json
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            node scripts/build-cube-index.mjs
            if git diff --quiet -- packing-cubes/cubes/index.json; then
              echo "index.json already up to date"
              exit 0
            fi
            git add packing-cubes/cubes/index.json
            git commit -m "Rebuild cube catalog index [skip ci]"
            if git push; then exit 0; fi
            echo "push rejected (main moved) — syncing and retrying"
            git reset --soft HEAD~1
            git pull --rebase --autostash origin main
          done
          echo "Could not push index.json after retries" >&2
          exit 1
