name: Cleanup Neon preview branch

# Deletes the Neon database branch created by the Vercel integration when a
# PR is closed or merged. Vercel names those branches preview/<git-branch>.
on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
