<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/packing-cubes/" />
    <title>Cube — Packing Cubes</title>
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="./engine/cube.css" />
  </head>
  <body class="pc-body">

    <nav class="pc-nav">
      <div class="pc-nav-brand">
        <a href="/" class="pc-nav-logo">
          <img src="/ugly-dog-images/dog-3.png" alt="" width="20" height="20" style="object-fit:contain;flex-shrink:0;" />
          Beep boop
        </a>
        <a href="/packing-cubes/" class="pc-nav-section">
          <img src="/packing-cubes/icon.svg" alt="" width="22" height="22" style="object-fit:contain;flex-shrink:0;filter:brightness(0) invert(1);">
          <span>Packing Cubes</span>
        </a>
      </div>
      <div class="pc-nav-links">
        <a href="/packing-cubes/">All cubes</a>
        <a href="/account.html?next=%2Fpacking-cubes%2F" id="nav-auth-link">Log in</a>
      </div>
    </nav>

    <div class="pc-wrap flex-grow" id="cube-root" style="padding-top:32px;padding-bottom:48px">
      <p style="font-weight:700;color:var(--brown)">Loading cube…</p>
    </div>

    <script type="module">
      import { cubeJsonUrl } from './engine/paths.js';
      import { initAuth, wireAuthLink, refreshToken } from './engine/auth.js';
      import { cubesApi } from './engine/api.js';

      const root = document.getElementById('cube-root');
      const id = new URLSearchParams(location.search).get('cube');

      function escapeHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      async function loadCube(auth) {
        if (auth.signedIn && auth.token) {
          try {
            const data = await cubesApi.get(auth.token, id);
            return data.cube;
          } catch (err) {
            if (err.status !== 404) throw err;
          }
        }
        const res = await fetch(cubeJsonUrl(id));
        if (!res.ok) throw new Error('not found');
        return res.json();
      }

      if (!id) {
        root.innerHTML = '<p style="font-weight:700;color:var(--brown)">No cube specified.</p>';
      } else {
        const auth = await initAuth();
        if (auth.configured && auth.user && !auth.token) await refreshToken(auth);
        wireAuthLink(auth);

        loadCube(auth)
          .then((cube) => {
            document.title = `${cube.title} — Packing Cubes`;
            const tags = (cube.tags || []).map((t) => `<span class="pc-tag">${escapeHtml(t)}</span>`).join('');
            const editLink = cube.mine
              ? `<a class="pc-btn" href="/packing-cubes/builder.html?edit=${encodeURIComponent(id)}">Edit cube</a>`
              : '';
            root.innerHTML = `
              <div class="pc-card" style="text-align:center;max-width:480px;margin:0 auto">
                <h1>${escapeHtml(cube.title)}</h1>
                <p class="blurb">${escapeHtml(cube.blurb || '')}</p>
                <div class="pc-tags">${tags}</div>
                <p class="pc-meta">${cube.items.length} item${cube.items.length === 1 ? '' : 's'}${cube.is_public === false ? ' · private' : ''}</p>
                <div class="pc-actions">
                  <a class="pc-btn primary" href="/packing-cubes/?add=${encodeURIComponent(id)}">Add to my suitcase</a>
                  <a class="pc-btn" href="/packing-cubes/">Back to app</a>
                  ${editLink}
                </div>
              </div>
              <ul class="pc-checklist pc-card" style="padding:0;margin-top:16px;max-width:480px;margin-left:auto;margin-right:auto">
                ${cube.items.map((item) => `<li><span>${escapeHtml(item.label)}</span></li>`).join('')}
              </ul>`;
          })
          .catch(() => {
            const loginHref = `/account.html?next=${encodeURIComponent(location.pathname + location.search)}`;
            root.innerHTML = `<p style="font-weight:700;color:var(--brown)">Could not find that cube.${auth.signedIn ? '' : ` <a href="${loginHref}">Sign in</a> if it's private.`}</p>`;
          });
      }
    </script>
  </body>
</html>
