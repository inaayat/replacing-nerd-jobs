<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/packing-cubes/" />
    <title>Cube — Packing Cubes</title>
    <link rel="icon" type="image/svg+xml" href="/packing-cubes/icon.svg" />
    <meta name="theme-color" content="#0c0b09" />
    <script>
      (function () {
        var KEY = 'packing-cubes-theme';
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) {}
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f6' : '#0c0b09');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./engine/cube.css" />
  </head>
  <body class="pc-body">

    <nav class="pc-nav">
      <div class="pc-nav-brand">
        <a href="/" class="pc-nav-logo">Beep boop</a>
        <a href="/packing-cubes/" class="pc-nav-section">
          <img src="/packing-cubes/icon.svg" alt="" width="22" height="22" style="object-fit:contain;flex-shrink:0;">
          <span>Packing Cubes</span>
        </a>
      </div>
      <div class="pc-nav-links">
        <a href="/packing-cubes/">My cubes</a>
        <a href="#pc-auth" id="nav-auth-link">Log in</a>
        <button type="button" class="pc-theme-toggle" id="pc-theme-toggle" aria-label="Switch to light mode" title="Light mode">
          <svg class="pc-theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M4.9 4.9l1.1 1.1M18 18l1.1 1.1M3 12h1.5M19.5 12H21M4.9 19.1 6 18M18 6l1.1-1.1"/></svg>
          <svg class="pc-theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A7.5 7.5 0 1 1 9.5 4 6 6 0 0 0 20 14.5z"/></svg>
        </button>
      </div>
    </nav>

    <div class="pc-wrap flex-grow" id="cube-root" style="padding-top:32px;padding-bottom:48px">
      <p class="pc-boot-message">Loading cube…</p>
    </div>

    <script type="module">
      import { initAuth, wireAuthLink, refreshToken, renderPackingSignIn } from './engine/auth.js';
      import { initThemeToggle } from './engine/theme.js';
      import { cubesApi } from './engine/api.js';
      import { cubeAddOns } from './engine/model.js';

      initThemeToggle();
      const root = document.getElementById('cube-root');
      const id = new URLSearchParams(location.search).get('cube');

      function escapeHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      if (!id) {
        root.innerHTML = '<p class="pc-boot-message">No cube specified.</p>';
      } else {
        const auth = await initAuth();
        if (auth.configured && auth.user && !auth.token) await refreshToken(auth);
        wireAuthLink(auth);

        if (!auth.signedIn || !auth.token) {
          renderPackingSignIn(root, {
            title: 'Sign in to open this cube',
            copy: 'Cubes are private to your account.',
            note: !auth.configured
              ? '<p class="pc-gate-error">Sign-in isn’t configured on this deployment yet.</p>'
              : '',
          });
          if (!auth.configured) {
            const form = root.querySelector('#pc-auth');
            if (form) form.hidden = true;
          }
        } else {
          cubesApi.get(auth.token, id)
            .then(({ cube }) => {
              document.title = `${cube.title} — Packing Cubes`;
              const tags = (cube.tags || []).map((t) => `<span class="pc-tag">${escapeHtml(t)}</span>`).join('');
              const addOns = cubeAddOns(cube);
              const meta = [
                `${cube.items.length} item${cube.items.length === 1 ? '' : 's'}`,
                addOns.length ? `${addOns.length} add-on${addOns.length === 1 ? '' : 's'}` : null,
              ].filter(Boolean).join(' · ');
              root.innerHTML = `
                <div class="pc-card" style="text-align:center;max-width:520px;margin:0 auto">
                  <h1>${escapeHtml(cube.title)}</h1>
                  <p class="blurb">${escapeHtml(cube.blurb || '')}</p>
                  <div class="pc-tags">${tags}</div>
                  <p class="pc-meta">${meta}</p>
                  <div class="pc-actions">
                    <a class="pc-btn primary" href="/packing-cubes/?add=${encodeURIComponent(id)}">Add to my packing list</a>
                    <a class="pc-btn" href="/packing-cubes/builder.html?edit=${encodeURIComponent(id)}">Edit cube</a>
                    <a class="pc-btn" href="/packing-cubes/">Back to app</a>
                  </div>
                </div>
                <ul class="pc-checklist pc-card" style="padding:0;margin-top:16px;max-width:520px;margin-left:auto;margin-right:auto">
                  ${cube.items.map((item) => `<li><span>${escapeHtml(item.label)}</span></li>`).join('')}
                </ul>
                ${addOns.map((addOn) => `
                  <div class="pc-card" style="padding:0;margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto;overflow:hidden">
                    <p class="pc-meta" style="margin:10px 12px 4px;text-align:left">Add-on · ${escapeHtml(addOn.title)}</p>
                    <ul class="pc-checklist">
                      ${(addOn.items || []).map((item) => `<li><span>${escapeHtml(item.label)}</span></li>`).join('')}
                    </ul>
                  </div>`).join('')}`;
            })
            .catch((err) => {
              root.innerHTML = `<p class="pc-boot-message">${err.status === 404
                ? 'That cube no longer exists.'
                : `Could not load that cube: ${escapeHtml(err.message)}`}</p>`;
            });
        }
      }
    </script>
  </body>
</html>
