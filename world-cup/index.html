<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Cup 2026 — Beep boop</title>
  <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --green:#3CAC3B; --navy:#2A398D; --red:#E61D25; --lgray:#D1D4D1; --dgray:#474A4A; }
    body { font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f4; }
    .fi { height:13px; width:auto; border-radius:2px; border:1px solid #ddd; flex-shrink:0; }
    .fi-sm { height:11px; width:auto; border-radius:1px; border:1px solid #ddd; flex-shrink:0; }
    .grp-card { background:#fff; border:2px solid var(--lgray); border-radius:8px; overflow:hidden; }
    .grp-head { background:var(--navy); color:#fff; padding:6px 12px; font-weight:800; font-size:13px; letter-spacing:.5px; }
    .grp-table { width:100%; border-collapse:collapse; }
    .grp-table th { background:var(--lgray); color:var(--dgray); padding:3px 6px; font-weight:700; text-align:center; font-size:10px; white-space:nowrap; }
    .grp-table th:first-child { text-align:left; }
    .grp-table td { padding:3px 6px; text-align:center; border-bottom:1px solid #f0f0f0; font-size:11px; }
    .grp-table td:first-child { text-align:left; font-weight:600; }
    .grp-table tr.q1 td, .grp-table tr.q2 td { border-left:3px solid var(--green); }
    .grp-table tr.q3 td { border-left:3px solid #f59e0b; }
    .mrow { display:flex; justify-content:space-between; align-items:center; padding:3px 8px; font-size:11px; border-top:1px solid #f5f5f5; gap:4px; }
    .tn { font-weight:600; color:var(--dgray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:76px; }
    .tn.win { color:var(--green); }
    .sc { background:var(--navy); color:#fff; padding:1px 5px; border-radius:3px; font-weight:700; font-size:11px; white-space:nowrap; }
    .sc.lv { background:var(--red); }
    .blive { background:var(--red); color:#fff; font-size:8px; font-weight:700; padding:1px 3px; border-radius:2px; }
    .bft   { background:var(--lgray); color:var(--dgray); font-size:8px; font-weight:700; padding:1px 3px; border-radius:2px; }
    .bm { background:#fff; border:2px solid var(--lgray); border-radius:6px; overflow:hidden; }
    .bmhd { background:rgba(42,57,141,.08); padding:2px 7px; font-size:9px; font-weight:700; color:var(--dgray); display:flex; justify-content:space-between; align-items:center; }
    .bmt { padding:4px 7px; display:flex; justify-content:space-between; align-items:center; gap:5px; border-bottom:1px solid var(--lgray); }
    .bmt:last-child { border-bottom:none; }
    .bmt.win { background:var(--green); color:#fff; font-weight:700; }
    .bmt.tbd { color:#bbb; font-style:italic; }
    .bmt .bs { background:var(--navy); color:#fff; padding:1px 5px; border-radius:3px; font-weight:700; font-size:10px; min-width:16px; text-align:center; }
    .bmt.win .bs { background:rgba(0,0,0,.22); }
    .rcol { display:flex; flex-direction:column; flex-shrink:0; padding:0 5px; }
    .rlbl { background:var(--dgray); color:#fff; font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:3px; text-align:center; margin-bottom:8px; white-space:nowrap; }
    .rms { display:flex; flex-direction:column; justify-content:space-around; flex:1; gap:6px; }
  </style>
</head>

const LV={};

function stand(grp){
  const s={};GRP[grp].forEach(t=>s[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});
  GM.filter(m=>m.g===grp).forEach(m=>{
    const v=LV[m.n];if(!v||v.g1===null||v.g1===''||v.g2===null||v.g2==='')return;
    const a=+v.g1,b=+v.g2;if(isNaN(a)||isNaN(b)||!s[m.t1]||!s[m.t2])return;
    s[m.t1].p++;s[m.t2].p++;s[m.t1].gf+=a;s[m.t1].ga+=b;s[m.t1].gd+=a-b;
    s[m.t2].gf+=b;s[m.t2].ga+=a;s[m.t2].gd+=b-a;
    if(a>b){s[m.t1].w++;s[m.t1].pts+=3;s[m.t2].l++;}
    else if(a<b){s[m.t2].w++;s[m.t2].pts+=3;s[m.t1].l++;}
    else{s[m.t1].d++;s[m.t1].pts++;s[m.t2].d++;s[m.t2].pts++;}
  });
  return Object.entries(s).map(([nm,v])=>({nm,...v}))
    .sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.nm.localeCompare(b.nm));
}

function rGrps(){
  document.getElementById('gg').innerHTML=Object.keys(GRP).map(grp=>{
    const st=stand(grp);
    const rows=st.map((t,i)=>{
      const cl=i<2?'q'+(i+1):i===2?'q3':'';
      const gd=t.p?(t.gd>0?'+'+t.gd:String(t.gd)):'—';
      const gc=t.gd>0?'var(--green)':t.gd<0?'var(--red)':'inherit';
      return `<tr class="${cl}"><td><div style="display:flex;align-items:center;gap:5px">${fi(t.nm,true)}<span>${t.nm}</span></div></td>
        <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td>
        <td style="font-weight:700;color:${gc}">${gd}</td><td style="font-weight:800">${t.pts}</td></tr>`;
    }).join('');
    const ms=GM.filter(m=>m.g===grp).map(m=>{
      const v=LV[m.n];
      const has=v&&v.g1!==null&&v.g1!==''&&v.g2!==null&&v.g2!=='';
      const isL=v&&v.st==='live',isF=v&&v.st==='FT';
      const t1w=has&&+v.g1>+v.g2,t2w=has&&+v.g2>+v.g1;
      const bd=isL?'<span class="blive">LIVE</span>':isF?'<span class="bft">FT</span>':'';
      const sc=has?`<span class="sc${isL?' lv':''}">${v.g1}–${v.g2}</span>`:`<span style="font-size:10px;color:#bbb">${m.d}</span>`;
      return `<div class="mrow">
        <div style="display:flex;align-items:center;gap:4px;flex:1;overflow:hidden;min-width:0">
          ${fi(m.t1,true)}<span class="tn${t1w?' win':''}">${m.t1}</span>
          <span style="color:#ccc;font-size:10px;flex-shrink:0">vs</span>
          ${fi(m.t2,true)}<span class="tn${t2w?' win':''}">${m.t2}</span>
        </div>
        <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">${bd}${sc}</div>
      </div>`;
    }).join('');
    return `<div class="grp-card">
      <div class="grp-head">Group ${grp}</div>
      <table class="grp-table"><thead><tr>
        <th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
      </tr></thead><tbody>${rows}</tbody></table>
      <div style="padding:2px 0">${ms}</div>
    </div>`;
  }).join('');
}

function bm(m){
  const v=LV[m.n];
  const has=v&&v.g1!==null&&v.g1!==''&&v.g2!==null&&v.g2!=='';
  const isL=v&&v.st==='live',isF=v&&v.st==='FT';
  const t1w=has&&+v.g1>+v.g2,t2w=has&&+v.g2>+v.g1;
  const sl={R32:'R32',R16:'R16',QF:'QF',SF:'SF','3P':'3rd',F:'⚽ FINAL'}[m.s]||m.s;
  const bd=isL?'<span class="blive" style="font-size:7px">LIVE</span>':isF?'<span class="bft" style="font-size:7px">FT</span>':'';
  const tr=(t,sc,win)=>`<div class="bmt${win?' win':''}${!t1w&&!t2w&&!has?' tbd':''}">
    <div style="display:flex;align-items:center;gap:5px;overflow:hidden;min-width:0">
      ${fi(t,false)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">${t}</span>
    </div>${has?`<span class="bs">${sc}</span>`:''}
  </div>`;
  return `<div class="bm"><div class="bmhd"><span>${sl} · ${m.d}</span>${bd}</div>${tr(m.t1,has?v.g1:'',t1w)}${tr(m.t2,has?v.g2:'',t2w)}</div>`;
}

function rKo(){
  const w=document.getElementById('bw');
  const rounds=[
    {l:'Round of 32',ms:KO.filter(m=>m.s==='R32')},
    {l:'Round of 16',ms:KO.filter(m=>m.s==='R16')},
    {l:'Quarterfinals',ms:KO.filter(m=>m.s==='QF')},
    {l:'Semifinals',ms:KO.filter(m=>m.s==='SF')},
    {l:'Final',ms:KO.filter(m=>m.s==='F')},
  ];
  const cols=rounds.map(r=>`<div class="rcol" style="width:182px"><div class="rlbl">${r.l}</div><div class="rms">${r.ms.map(bm).join('')}</div></div>`).join('');
  const tp=KO.find(m=>m.s==='3P');
  w.innerHTML=cols+`<div class="rcol" style="width:182px"><div class="rlbl">3rd Place</div><div style="margin-top:auto">${bm(tp)}</div></div>`;
}

const AM={"USA":"United States","Korea Republic":"South Korea","Côte d'Ivoire":"Ivory Coast","Cote d'Ivoire":"Ivory Coast","Curaçao":"Curacao"};
const nm=n=>AM[n]||n;

async function fetch_data(){
  try{
    const r=await fetch('/api/football?action=fixtures');
    if(!r.ok)throw 0;
    const{fixtures:fx}=await r.json();
    if(!fx)return;
    fx.forEach(f=>{
      const h=nm(f.home),a=nm(f.away),st=f.status;
      const fin=['FT','AET','PEN'].includes(st),lv=['1H','HT','2H','ET'].includes(st);
      const m=GM.find(m=>(m.t1===h&&m.t2===a)||(m.t1===a&&m.t2===h));
      if(m){const sw=m.t1!==h;LV[m.n]={st:fin?'FT':lv?'live':st,g1:sw?f.awayGoals:f.homeGoals,g2:sw?f.homeGoals:f.awayGoals};}
    });
    document.getElementById('lu').textContent='Updated '+new Date().toLocaleTimeString();
  }catch{document.getElementById('lu').textContent='Live data unavailable';}
}

async function go(){await fetch_data();rGrps();rKo();}
go();setInterval(go,5*60*1000);
</script>
