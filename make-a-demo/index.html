<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/make-a-demo/" />
    <title>make a demo — Beep boop</title>
    <meta
      name="description"
      content="A filler shell that says make a demo, with placeholder page options."
    />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <nav class="mad-nav">
      <div class="mad-nav-brand">
        <a href="/" class="mad-nav-logo" aria-label="Beep boop home">
          <img src="/ugly-dog-images/dog-3.png" alt="" width="18" height="18" />
          <span>Beep boop</span>
        </a>
        <a href="/make-a-demo/" class="mad-nav-section">
          <img src="/make-a-demo/icon.svg" alt="" width="22" height="22" />
          <span>make a demo</span>
        </a>
      </div>
      <div class="mad-nav-links">
        <a class="mad-home" href="/">Home</a>
        <a href="/#projects">Projects</a>
      </div>
    </nav>

    <main class="mad-shell">
      <header class="mad-hero">
        <p class="mad-kicker">inaayat.xyz</p>
        <h1>make a demo</h1>
        <p class="mad-lede">
          A blank product shell with filler page options. Pick one — the panel
          below changes. Nothing is saved.
        </p>
      </header>

      <nav class="mad-options" id="options" aria-label="Filler pages"></nav>
      <section class="mad-panel" id="panel" aria-live="polite"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
