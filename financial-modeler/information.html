<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <base href="/financial-modeler/" />
    <title>Company filings — Financial modeler</title>
    <meta
      name="description"
      content="Every XBRL metric pulled for a public company: values, definitions, and the SEC tag they came from."
    />
    <link rel="icon" type="image/png" href="/ugly-dog-images/dog-3.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./information.css" />
  </head>
  <body class="fm-info">
    <nav class="fm-nav">
      <div class="fm-nav-brand">
        <a href="/" class="fm-nav-logo" aria-label="Beep boop home">
          <img src="/ugly-dog-images/dog-3.png" alt="" width="18" height="18" />
          <span>Beep boop</span>
        </a>
        <a href="/financial-modeler/" class="fm-nav-section">
          <img src="/financial-modeler/icon.svg" alt="" width="22" height="22" />
          <span>Financial modeler</span>
        </a>
      </div>
      <div class="fm-nav-links">
        <a href="/financial-modeler/information.html" aria-current="page">Filings</a>
        <a href="/financial-modeler/">Model</a>
        <a href="/fortune-500/">10-K ratios</a>
        <a href="/#projects">Projects</a>
      </div>
    </nav>

    <main class="fm-info-shell">
      <header class="fm-info-hero">
        <h1>Company filings</h1>
        <p>
          Every metric extracted from the latest annual report for a public company in this catalog.
          A dash means the 10-K (or 20-F) did not tag that line — not a value of zero.
        </p>
      </header>

      <div class="fm-info-search-wrap">
        <label class="fm-info-search-label" for="info-search">Company</label>
        <input
          id="info-search"
          class="fm-search"
          type="search"
          placeholder="Search by name or ticker…"
          autocomplete="off"
          aria-label="Search companies"
        />
        <div class="fm-results" id="info-results" hidden></div>
        <p class="fm-status" id="info-status">Loading the company list…</p>
      </div>

      <section id="info-company" hidden></section>
    </main>
    <script type="module" src="./information.js"></script>
  </body>
</html>
